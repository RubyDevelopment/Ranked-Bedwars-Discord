name: Update Database module

on:
  push:
    branches: [main]
    paths-ignore:
      - go.mod
      - go.sum

permissions:
  contents: write

concurrency:
  group: update-database
  cancel-in-progress: false

env:
  DATABASE_MODULE: github.com/RubyDevelopment/Ranked-Bedwars-Database
  GOPRIVATE: github.com/RubyDevelopment/*
  GOSUMDB: "off"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Let git read the private Database repository
        env:
          DATABASE_REPO_TOKEN: ${{ secrets.DATABASE_REPO_TOKEN }}
        run: |
          if [ -z "$DATABASE_REPO_TOKEN" ]; then
            echo "::error::Add the DATABASE_REPO_TOKEN repository secret (read-only Contents access to the Database repo)."
            exit 1
          fi
          git config --global \
            "url.https://x-access-token:${DATABASE_REPO_TOKEN}@github.com/RubyDevelopment/Ranked-Bedwars-Database.insteadOf" \
            "https://github.com/RubyDevelopment/Ranked-Bedwars-Database"

      - name: Move to the latest Database tag
        id: bump
        run: |
          before=$(go list -m -f '{{.Version}}' "$DATABASE_MODULE")
          go get "$DATABASE_MODULE@latest"
          go mod tidy
          after=$(go list -m -f '{{.Version}}' "$DATABASE_MODULE")
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "Database module: $before -> $after"

      - name: Build and vet with it
        run: |
          go build ./...
          go vet ./...

      - name: Commit go.mod and go.sum
        if: steps.bump.outputs.before != steps.bump.outputs.after
        env:
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Update Database module to ${AFTER}" -m "Was ${BEFORE}. Updated automatically from the latest Database release tag."
          git push origin HEAD:main