name: Deploy Discord Bot to Server (SFTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be uploaded or deleted without changing the server
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-sftp
  cancel-in-progress: false

env:
  SFTP_HOST: v-par-11.apollopanel.com
  SFTP_PORT: "2022"
  SFTP_USER: wiggels.9c3c30b9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Trust the server's host key
        env:
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SFTP_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SFTP_KNOWN_HOSTS is not set: the host key is fetched now instead of checked against a known one."
            ssh-keyscan -p "$SFTP_PORT" -H "$SFTP_HOST" > ~/.ssh/known_hosts
          fi

      - name: Upload the files
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::Add the SFTP_PASSWORD repository secret."
            exit 1
          fi
          lftp -u "$SFTP_USER","$LFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          set net:max-retries 3
          set net:timeout 30
          set net:reconnect-interval-base 5
          mirror --reverse --delete --no-perms --ignore-time $DRY --parallel=4 --verbose \
            --exclude-glob .git/ --exclude-glob .github/ --exclude-glob logs/ --exclude-glob backups/ \
            --exclude-glob .env --exclude-glob .env* \
            --exclude-glob .trash/ \
            --exclude-glob *.db --exclude-glob *.sqlite --exclude-glob *.sqlite3 --exclude-glob data/ \
            --exclude-glob .cache/ --exclude-glob .go/ --exclude-glob node_modules/ \
            --exclude-glob bin/ --exclude-glob dist/ --exclude-glob main --exclude-glob vendor/ \
            --exclude-glob *.exe --exclude-glob *.test --exclude-glob *.out --exclude-glob coverage.* \
            --exclude-glob .idea/ --exclude-glob .vscode/ --exclude-glob *.swp --exclude-glob .DS_Store \
            . /
          bye
          EOF