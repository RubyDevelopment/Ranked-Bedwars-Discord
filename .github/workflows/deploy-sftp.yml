name: Deploy Discord Bot to Server (SFTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be uploaded or deleted without changing the server
        type: boolean
        default: false

permissions:
  contents: write # to commit the go.mod bump

concurrency:
  group: deploy-sftp
  cancel-in-progress: false

env:
  SFTP_HOST: v-par-11.apollopanel.com
  SFTP_PORT: "2022"
  SFTP_USER: wiggels.9c3c30b9
  DATABASE_MODULE: github.com/RubyDevelopment/Ranked-Bedwars-Database
  GOPRIVATE: github.com/RubyDevelopment/*
  GOSUMDB: "off"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Wait for the Database repository's "Tag release" to finish before pushing here: this takes whatever its newest tag is.
      - name: Let git read the private Database repository
        env:
          DATABASE_REPO_TOKEN: ${{ secrets.DATABASE_REPO_TOKEN }}
        run: |
          if [ -z "$DATABASE_REPO_TOKEN" ]; then
            echo "::error::Add the DATABASE_REPO_TOKEN repository secret (read-only Contents access to the Database repo)."
            exit 1
          fi
          git config --global             "url.https://x-access-token:${DATABASE_REPO_TOKEN}@github.com/RubyDevelopment/Ranked-Bedwars-Database.insteadOf"             "https://github.com/RubyDevelopment/Ranked-Bedwars-Database"

      - name: Move to the latest Database tag
        id: bump
        run: |
          before=$(go list -m -f '{{.Version}}' "$DATABASE_MODULE")
          go get "$DATABASE_MODULE@latest"
          go mod tidy
          after=$(go list -m -f '{{.Version}}' "$DATABASE_MODULE")
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "Database module: $before -> $after"

      - name: Build and vet with it
        run: |
          go build ./...
          go vet ./...

      - name: Commit go.mod and go.sum
        if: steps.bump.outputs.before != steps.bump.outputs.after && !inputs.dry_run
        env:
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Update Database module to ${AFTER}" -m "Was ${BEFORE}. Updated automatically from the latest Database release tag."
          git push origin HEAD:main

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Trust the server's host key
        env:
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SFTP_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SFTP_KNOWN_HOSTS is not set: the host key is fetched now instead of checked against a known one."
            ssh-keyscan -p "$SFTP_PORT" -H "$SFTP_HOST" > ~/.ssh/known_hosts
          fi

      - name: Upload the files
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::Add the SFTP_PASSWORD repository secret."
            exit 1
          fi
          lftp -u "$SFTP_USER","$LFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          set net:max-retries 3
          set net:timeout 30
          set net:reconnect-interval-base 5
          mirror --reverse --delete --no-perms $DRY --parallel=4 --verbose \
            --exclude-glob .git/ --exclude-glob .github/ --exclude-glob logs/ --exclude-glob backups/ \
            --exclude-glob .env --exclude-glob .env* \
            --exclude-glob .trash/ --exclude-glob .apollo/ --exclude-glob .config/ \
            --exclude-glob *.db --exclude-glob *.sqlite --exclude-glob *.sqlite3 --exclude-glob data/ \
            --exclude-glob .cache/ --exclude-glob .go/ --exclude-glob node_modules/ \
            --exclude-glob bin/ --exclude-glob dist/ --exclude-glob main --exclude-glob vendor/ \
            --exclude-glob *.exe --exclude-glob *.test --exclude-glob *.out --exclude-glob coverage.* \
            --exclude-glob .idea/ --exclude-glob .vscode/ --exclude-glob *.swp --exclude-glob .DS_Store \
            . /
          bye
          EOF